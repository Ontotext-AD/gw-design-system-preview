<p-toast />

<div class="shell">
  <aside class="shell__sidebar" aria-label="Component navigation">
    <a class="page__logo" [href]="homeUrl" aria-label="GВ Design System Home">
      <span class="shell__brand-mark pi pi-th-large" aria-hidden="true"></span>
      <span class="shell__brand-text">GВ Design System</span>
    </a>

    <nav class="shell__nav" aria-label="Primary">
      @for (group of navGroups; track group.label) {
        <section class="shell__nav-group">
          <button
            type="button"
            class="shell__nav-group-toggle"
            (click)="group.expanded = !group.expanded"
            [attr.aria-expanded]="group.expanded"
          >
            <span>{{ group.label }}</span>
            <span
              class="pi"
              [class.pi-chevron-down]="group.expanded"
              [class.pi-chevron-right]="!group.expanded"
              aria-hidden="true"
            ></span>
          </button>

          @if (group.expanded) {
            <div class="shell__nav-items">
              @for (item of group.items; track item.path) {
                <a
                  class="shell__nav-item"
                  [routerLink]="item.path"
                  routerLinkActive="is-active"
                  #rla="routerLinkActive"
                  [attr.aria-current]="rla.isActive ? 'page' : null"
                >
                  <span
                    class="pi"
                    [class.pi-circle]="!rla.isActive"
                    [class.pi-check-circle]="rla.isActive"
                    aria-hidden="true"
                  ></span>
                  <span>{{ item.label }}</span>
                </a>
              }
            </div>
          }
        </section>
      }
    </nav>
  </aside>

  <div class="shell__content">
    <header class="page__header">
      <div class="page__title">
        <div>
          <h1>Graphwise Design System Preview</h1>
          <p>
            PrimeNG components themed with the <code>graphwise-styleguide</code> tokens
            (<code>--gw-*</code>).
          </p>
        </div>
      </div>
      <div class="page__theme">
        <span class="pi" [class.pi-sun]="!theme.isDark()" [class.pi-moon]="theme.isDark()"></span>
        <p-select
          [options]="themeOptions"
          [ngModel]="theme.mode()"
          (ngModelChange)="theme.setMode($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Theme"
          [style]="{ minWidth: '10rem' }"
        />
      </div>
    </header>

    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
